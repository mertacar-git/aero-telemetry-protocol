name: Python checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug && cmake --build build && ctest --test-dir build --output-on-failure
      - run: python verify_cpp.py build/codec_test
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --test docs/models.test.cjs
